<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="mark-title">
  <title id="mark-title">Parchment Ledger emblem — the butler's pocket watch with the PB monogram on the dial</title>
  <!-- Ivory tile -->
  <rect width="96" height="96" rx="20" fill="#faf9f5"/>
  <rect x="0.5" y="0.5" width="95" height="95" rx="19.5" fill="none" stroke="#f0eee6"/>
  <!-- Chain bow and stem at twelve -->
  <circle cx="48" cy="11" r="3.5" fill="none" stroke="#c96442" stroke-width="1.5"/>
  <line x1="48" y1="14.5" x2="48" y2="21" stroke="#c96442" stroke-width="1.5"/>
  <!-- Watch case and dial -->
  <circle cx="48" cy="51" r="30" fill="none" stroke="#c96442" stroke-width="2"/>
  <circle cx="48" cy="51" r="26.5" fill="none" stroke="#c96442" stroke-width="0.75" opacity="0.7"/>
  <line x1="21.5" y1="51" x2="24.5" y2="51" stroke="#c96442" stroke-width="1"/>
  <line x1="71.5" y1="51" x2="74.5" y2="51" stroke="#c96442" stroke-width="1"/>
  <!-- Monogram on the dial -->
  <text x="48" y="59.5" text-anchor="middle" font-family="Fraunces,Georgia,'Times New Roman',serif" font-weight="600" font-size="24" letter-spacing="0.5" fill="#c96442">PB</text>
</svg>
