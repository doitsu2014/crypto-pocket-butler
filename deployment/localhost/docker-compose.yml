# Local development stack for Crypto Pocket Butler.
#
# This file runs the whole system on one machine: a self-hosted Supabase
# (Postgres, Auth, REST, Storage, Studio, Mailpit, Kong), the schema migrations,
# every Rust service, the SPA and the support console.
#
# It is NOT a production deployment model. Production is the Docker Swarm stack
# in infra/swarm-stack.yml, with Vault-issued credentials and one image per
# service. Here every secret is generated locally by scripts/init-env.sh into
# .env and secrets/.
#
# First run:
#   ./scripts/init-env.sh
#   docker compose up --build
#
# See README.md for endpoints, the admin login and known gaps.

name: cpb-local

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------

x-jwt: &jwt
  JWT_JWKS_URL: http://auth:9999/.well-known/jwks.json
  JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?run scripts/init-env.sh first}
  JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp

x-app-db-password: &db-password ${LOCAL_DB_PASSWORD:?run scripts/init-env.sh first}

# ---------------------------------------------------------------------------
# Supabase (self-hosted, local only)
# ---------------------------------------------------------------------------

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_URL:?run scripts/init-env.sh first}
      GOTRUE_SITE_URL: ${SPA_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: http://localhost:8080,http://127.0.0.1:8080
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS:?}
      GOTRUE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:?}
      GOTRUE_JWT_AUD: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cpb.local}
      GOTRUE_SMTP_SENDER_NAME: Crypto Pocket Butler
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${SUPABASE_PUBLIC_JWKS:?}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: supabase/storage-api:v1.89.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      JWT_JWKS: ${SUPABASE_PUBLIC_JWKS:?}
      DATABASE_URL: postgres://supabase_storage_admin:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_URL:?}/storage/v1
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CRYPTO_KEY: ${STUDIO_PG_META_CRYPTO_KEY:?}

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./supabase/kong.generated.yml:/home/kong/kong.yml:ro
    ports:
      - "54321:8000"

  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
      kong:
        condition: service_started
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${STUDIO_PG_META_CRYPTO_KEY:?}
      PGRST_DB_SCHEMAS: public
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL:?}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
      DEFAULT_ORGANIZATION_NAME: Crypto Pocket Butler
      DEFAULT_PROJECT_NAME: local
    ports:
      - "54323:3000"

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "54324:8025"
      - "1025:1025"

  # -------------------------------------------------------------------------
  # One-shot provisioning
  # -------------------------------------------------------------------------

  provision:
    image: supabase/postgres:15.8.1.060
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgres
      PGADMIN_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LOCAL_DB_PASSWORD: *db-password
    volumes:
      - ../../services:/services:ro
      - ./init:/init:ro
      - ./scripts:/scripts:ro
      - ./secrets:/run/tokens:ro
    entrypoint: ["/bin/bash", "/scripts/provision.sh"]

  storage-init:
    image: supabase/postgres:15.8.1.060
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LOCAL_DB_PASSWORD: *db-password
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/storage-init.sh"]

  # -------------------------------------------------------------------------
  # Crypto Pocket Butler services
  # -------------------------------------------------------------------------

  asset-registry:
    <<: *service
    build:
      context: ../..
      dockerfile: services/asset-registry/Dockerfile
    image: cpb-local/asset-registry:local
    ports:
      - "8081:8081"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ASSET_REGISTRY_PORT: "8081"
      DATABASE_URL: postgres://registry_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      <<: *jwt
    depends_on:
      provision:
        condition: service_completed_successfully

  gateway:
    <<: *service
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    image: cpb-local/gateway:local
    ports:
      - "8082:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      GATEWAY_PORT: "8080"
      ASSET_REGISTRY_URL: http://asset-registry:8081
      <<: *jwt
    depends_on:
      asset-registry:
        condition: service_started

  audit-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/audit/Dockerfile.api
    image: cpb-local/audit-api:local
    ports:
      - "8084:8084"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      AUDIT_PORT: "8084"
      DATABASE_URL: postgres://audit_app:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      <<: *jwt
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  audit-retention:
    <<: *service
    build:
      context: ../..
      dockerfile: services/audit/Dockerfile.retention
    image: cpb-local/audit-retention:local
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://audit_retention:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
    depends_on:
      provision:
        condition: service_completed_successfully

  identity-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile.api
    image: cpb-local/identity-api:local
    ports:
      - "8083:8083"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      IDENTITY_PORT: "8083"
      DATABASE_URL: postgres://identity_app:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      GATE_TOKEN_KEY: ${IDENTITY_GATE_TOKEN_KEY:?}
      SUPABASE_AUTH_URL: http://auth:9999
      SUPABASE_STORAGE_URL: http://storage:5000
      IDENTITY_EXPORT_BUCKET: identity-exports
      IDENTITY_WORKER_URL: http://identity-worker:8085
      IDENTITY_TOKEN_SERVICE: identity
      AUDIT_URL: http://audit-api:8084
      ACCOUNT_URL: http://account-api:8091
      LEDGER_URL: http://ledger-api:8097
      PORTFOLIO_URL: http://portfolio-api:8101
      <<: *jwt
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  identity-worker:
    <<: *service
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile.worker
    image: cpb-local/identity-worker:local
    ports:
      - "8085:8085"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      IDENTITY_WORKER_PORT: "8085"
      DATABASE_URL: postgres://identity_app:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_AUTH_URL: http://auth:9999
      SUPABASE_STORAGE_URL: http://storage:5000
      IDENTITY_EXPORT_BUCKET: identity-exports
      IDENTITY_TOKEN_SERVICE: identity
      AUDIT_URL: http://audit-api:8084
      ACCOUNT_URL: http://account-api:8091
      LEDGER_URL: http://ledger-api:8097
      PORTFOLIO_URL: http://portfolio-api:8101
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  account-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/account/Dockerfile.api
    image: cpb-local/account-api:local
    ports:
      - "8091:8091"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ACCOUNT_PORT: "8091"
      DATABASE_URL: postgres://account_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_AUTH_URL: http://auth:9999
      ACCOUNT_WORKER_URL: http://account-worker:8092
      ACCOUNT_TOKEN_SERVICE: account
      AUDIT_URL: http://audit-api:8084
      NOTIFICATION_URL: http://notification-api:8099
      ASSET_REGISTRY_URL: http://asset-registry:8081
      EVM_RPC_URL: ${EVM_RPC_URL:-https://ethereum-rpc.publicnode.com}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      <<: *jwt
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  account-worker:
    <<: *service
    build:
      context: ../..
      dockerfile: services/account/Dockerfile.worker
    image: cpb-local/account-worker:local
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ACCOUNT_WORKER_PORT: "8092"
      DATABASE_URL: postgres://account_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_AUTH_URL: http://auth:9999
      ACCOUNT_TOKEN_SERVICE: account
      AUDIT_URL: http://audit-api:8084
      NOTIFICATION_URL: http://notification-api:8099
      ASSET_REGISTRY_URL: http://asset-registry:8081
      EVM_RPC_URL: ${EVM_RPC_URL:-https://ethereum-rpc.publicnode.com}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  portfolio-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/portfolio/Dockerfile.api
    image: cpb-local/portfolio-api:local
    ports:
      - "8101:8101"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORTFOLIO_PORT: "8101"
      DATABASE_URL: postgres://portfolio_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/portfolio.token
      ACCOUNT_URL: http://account-api:8091
      MARKET_DATA_URL: http://market-data-api:8093
      LEDGER_URL: http://ledger-api:8097
      IDENTITY_URL: http://identity-api:8083
      NOTIFICATION_URL: http://notification-api:8099
      AUDIT_URL: http://audit-api:8084
      PORTFOLIO_WORKER_URL: http://portfolio-worker:8102
      PORTFOLIO_TOKEN_SERVICE: portfolio
      <<: *jwt
    volumes:
      - ./secrets/outbound/portfolio.token:/run/secrets/portfolio.token:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  portfolio-worker:
    <<: *service
    build:
      context: ../..
      dockerfile: services/portfolio/Dockerfile.worker
    image: cpb-local/portfolio-worker:local
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORTFOLIO_WORKER_PORT: "8102"
      DATABASE_URL: postgres://portfolio_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/portfolio.token
      ACCOUNT_URL: http://account-api:8091
      MARKET_DATA_URL: http://market-data-api:8093
      LEDGER_URL: http://ledger-api:8097
      IDENTITY_URL: http://identity-api:8083
      NOTIFICATION_URL: http://notification-api:8099
      AUDIT_URL: http://audit-api:8084
      PORTFOLIO_TOKEN_SERVICE: portfolio
      PORTFOLIO_RUN_INTERVAL_SECONDS: ${PORTFOLIO_RUN_INTERVAL_SECONDS:-3600}
    volumes:
      - ./secrets/outbound/portfolio.token:/run/secrets/portfolio.token:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  job-orchestration:
    <<: *service
    build:
      context: ../..
      dockerfile: services/job-orchestration/Dockerfile.api
    image: cpb-local/job-orchestration:local
    ports:
      - "8105:8105"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JOB_ORCHESTRATION_PORT: "8105"
      DATABASE_URL: postgres://job_orchestration_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/job-orchestration.token
      ACCOUNT_URL: http://account-api:8091
      MARKET_DATA_URL: http://market-data-api:8093
      PORTFOLIO_URL: http://portfolio-api:8101
      LEDGER_URL: http://ledger-api:8097
      ANALYTICS_URL: http://analytics-api:8095
      NOTIFICATION_URL: http://notification-api:8099
      REPORTING_URL: http://reporting-api:8103
      IDENTITY_URL: http://identity-api:8083
      AUDIT_URL: http://audit-api:8084
      JOB_ORCHESTRATION_TICK_SECONDS: "60"
      <<: *jwt
    volumes:
      - ./secrets/outbound/job-orchestration.token:/run/secrets/job-orchestration.token:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  reporting-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/reporting/Dockerfile.api
    image: cpb-local/reporting-api:local
    ports:
      - "8103:8103"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REPORTING_PORT: "8103"
      DATABASE_URL: postgres://reporting_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/reporting.token
      IDENTITY_URL: http://identity-api:8083
      PORTFOLIO_URL: http://portfolio-api:8101
      LEDGER_URL: http://ledger-api:8097
      NOTIFICATION_URL: http://notification-api:8099
      AUDIT_URL: http://audit-api:8084
      REPORTING_TOKEN_SERVICE: reporting
      <<: *jwt
    volumes:
      - ./secrets/outbound/reporting.token:/run/secrets/reporting.token:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  reporting-worker:
    <<: *service
    build:
      context: ../..
      dockerfile: services/reporting/Dockerfile.worker
    image: cpb-local/reporting-worker:local
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REPORTING_WORKER_PORT: "8104"
      DATABASE_URL: postgres://reporting_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/reporting.token
      IDENTITY_URL: http://identity-api:8083
      PORTFOLIO_URL: http://portfolio-api:8101
      LEDGER_URL: http://ledger-api:8097
      NOTIFICATION_URL: http://notification-api:8099
      AUDIT_URL: http://audit-api:8084
      REPORTING_TOKEN_SERVICE: reporting
      REPORTING_RUN_INTERVAL_SECONDS: ${REPORTING_RUN_INTERVAL_SECONDS:-3600}
    volumes:
      - ./secrets/outbound/reporting.token:/run/secrets/reporting.token:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  market-data-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile.api
    image: cpb-local/market-data-api:local
    ports:
      - "8093:8093"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      MARKET_DATA_PORT: "8093"
      DATABASE_URL: postgres://market_data_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      MARKET_DATA_TOKEN_SERVICE: market-data
      ASSET_REGISTRY_URL: http://asset-registry:8081
      AUDIT_URL: http://audit-api:8084
      MARKET_DATA_PROVIDER_URLS: ""
      MARKET_DATA_FX_BASE_CURRENCIES: ${MARKET_DATA_FX_BASE_CURRENCIES:-EUR,GBP,VND,USDT}
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  market-data-worker:
    <<: *service
    build:
      context: ../..
      dockerfile: services/market-data/Dockerfile.worker
    image: cpb-local/market-data-worker:local
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      MARKET_DATA_WORKER_PORT: "8094"
      DATABASE_URL: postgres://market_data_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      SERVICE_TOKENS_FILE: /run/secrets/service_tokens.json
      MARKET_DATA_TOKEN_SERVICE: market-data
      ASSET_REGISTRY_URL: http://asset-registry:8081
      AUDIT_URL: http://audit-api:8084
      MARKET_DATA_PROVIDER_URLS: ""
      MARKET_DATA_FX_BASE_CURRENCIES: ${MARKET_DATA_FX_BASE_CURRENCIES:-EUR,GBP,VND,USDT}
      MARKET_DATA_SWEEP_INTERVAL_SECONDS: ${MARKET_DATA_SWEEP_INTERVAL_SECONDS:-60}
    volumes:
      - ./secrets/service-tokens.json:/run/secrets/service_tokens.json:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  analytics-api:
    <<: *service
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile.api
    image: cpb-local/analytics-api:local
    ports:
      - "8095:8095"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      ANALYTICS_PORT: "8095"
      DATABASE_URL: postgres://analytics_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/analytics.token
      IDENTITY_URL: http://identity-api:8083
      AUDIT_URL: http://audit-api:8084
      <<: *jwt
    volumes:
