      DATABASE_URL: postgres://notification_svc:${LOCAL_DB_PASSWORD:?}@db:5432/postgres
      OUTBOUND_TOKEN_FILE: /run/secrets/notification.token
      EMAIL_KEY: ${NOTIFICATION_EMAIL_KEY:?}
      IDENTITY_URL: http://identity-api:8083
      AUDIT_URL: http://audit-api:8084
      EMAIL_PROVIDER_URL: http://mailpit:8025
      EMAIL_FROM: ${EMAIL_FROM:-notifications@cryptopocketbutler.example}
      <<: *jwt
    volumes:
      - ./secrets/outbound/notification.token:/run/secrets/notification.token:ro
    depends_on:
      provision:
        condition: service_completed_successfully

  notification-worker:
    <<: *service
    build:
