  # -------------------------------------------------------------------------
  # Web
  # -------------------------------------------------------------------------

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_GATEWAY_URL: /v1
        VITE_SUPABASE_URL: ${SUPABASE_URL:?}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
    image: cpb-web:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started

