[package]
name = "audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Audit service: binary wiring for audit-api and audit-retention"

[lib]
name = "audit"
path = "src/lib.rs"

[[bin]]
name = "audit-api"
path = "src/bin/api.rs"

[[bin]]
name = "audit-retention"
path = "src/bin/retention.rs"

[dependencies]
audit-domain = { path = "domain" }
audit-application = { path = "application" }
audit-infrastructure = { path = "infrastructure" }
audit-http = { path = "http" }

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
http-body-util.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
rsa.workspace = true
sqlx.workspace = true
tower.workspace = true
uuid.workspace = true
