[package]
name = "account"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Account service: binary wiring for account-api and account-worker"

[lib]
name = "account"
path = "src/lib.rs"

[[bin]]
name = "account-api"
path = "src/bin/api.rs"

[[bin]]
name = "account-worker"
