server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Access logs must not record request headers. The support console's
    # free-text read reason now travels in the POST /v1/support-grants body,
    # so neither the URL nor any header carries it: keep $request_body out of
    # every log_format as well, and do not add $http_* headers. The default
    # format logs the URL, which does not carry the reason.
    #
    # The SPA CSP's connect-src 'self' requires the API gateway to be
    # same-origin through this CDN host. If deploy configures VITE_GATEWAY_URL
    # on another origin, add that origin to connect-src or the C1 calls are
    # blocked.

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # The customer SPA policy (infrastructure specification). WalletConnect
    # relay/verify origins are the only external additions because C14 is a
    # contracted direct browser call; Supabase Auth is C13.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Reporting-Endpoints 'csp="/v1/telemetry/csp-reports"' always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; report-to csp" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output is immutable; the shell, worker and manifest must
    # never be served stale. Each cache location repeats the security headers
    # because an add_header in a location replaces the inherited set.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints 'csp="/v1/telemetry/csp-reports"' always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; report-to csp" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints 'csp="/v1/telemetry/csp-reports"' always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; report-to csp" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none';" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none';" always;
    }

    # The support console is a separate SPA. It never registers its own
    # service worker. The customer PWA's root-scoped worker would otherwise
    # control /support and the same-origin /v1 calls, so U2 makes that worker
    # bypass /support and /v1; the console also unregisters any registration
    # whose scope covers /support at startup. HTML is no-store and hashed
    # assets are immutable.
    location = /support {
        return 301 /support/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location /support/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location /support/ {
        try_files $uri $uri/ /support/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}

# Edge SLI source for the nginx-prometheus-exporter sidecar. It is on the
# internal container port only; no published Swarm port targets 8081.
server {
    listen 8081;
    server_name _;

    location = /nginx_status {
        stub_status;
        access_log off;
    }
}
