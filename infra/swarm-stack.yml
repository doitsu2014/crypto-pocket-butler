      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  notification-migrate:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/notification-migrate:${TAG:-latest}
    environment:
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/notification_migrate_database_url
    secrets:
      - notification_migrate_database_url
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

