[package]
name = "portfolio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Portfolio service: binary wiring for portfolio-api and portfolio-worker"

[lib]
name = "portfolio"
path = "src/lib.rs"

[[bin]]
name = "portfolio-api"
path = "src/bin/api.rs"

[[bin]]
name = "portfolio-worker"
