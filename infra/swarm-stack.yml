# Docker Swarm stack for the walking skeleton.
#
# Images are built and digest-pinned by the pipeline:
#   docker build -f services/gateway/Dockerfile -t <registry>/gateway:<tag> .
#   docker build -f services/asset-registry/Dockerfile -t <registry>/asset-registry:<tag> .
#   docker build -f web/Dockerfile -t <registry>/web:<tag> .
#   docker build -f services/audit/Dockerfile.api -t <registry>/audit-api:<tag> .
#   docker build -f services/audit/Dockerfile.retention -t <registry>/audit-retention:<tag> .
#   docker build -f services/identity/Dockerfile.api -t <registry>/identity-api:<tag> .
#   docker build -f services/identity/Dockerfile.worker -t <registry>/identity-worker:<tag> .
#   docker build -f services/account/Dockerfile.api -t <registry>/account-api:<tag> .
#   docker build -f services/account/Dockerfile.worker -t <registry>/account-worker:<tag> .
#   docker build -f services/account/Dockerfile.migrate -t <registry>/account-migrate:<tag> .
#   docker build -f services/portfolio/Dockerfile.api -t <registry>/portfolio-api:<tag> .
#   docker build -f services/portfolio/Dockerfile.worker -t <registry>/portfolio-worker:<tag> .
#   docker build -f services/portfolio/Dockerfile.migrate -t <registry>/portfolio-migrate:<tag> .
#   docker build -f services/market-data/Dockerfile.api -t <registry>/market-data-api:<tag> .
#   docker build -f services/market-data/Dockerfile.worker -t <registry>/market-data-worker:<tag> .
#   docker build -f services/market-data/Dockerfile.migrate -t <registry>/market-data-migrate:<tag> .
#   docker build -f services/analytics/Dockerfile.api -t <registry>/analytics-api:<tag> .
#   docker build -f services/analytics/Dockerfile.worker -t <registry>/analytics-worker:<tag> .
#   docker build -f services/analytics/Dockerfile.migrate -t <registry>/analytics-migrate:<tag> .
#   docker build -f services/ledger/Dockerfile.api -t <registry>/ledger-api:<tag> .
#   docker build -f services/ledger/Dockerfile.worker -t <registry>/ledger-worker:<tag> .
#   docker build -f services/ledger/Dockerfile.migrate -t <registry>/ledger-migrate:<tag> .
#   docker build -f services/reporting/Dockerfile.api -t <registry>/reporting-api:<tag> .
#   docker build -f services/reporting/Dockerfile.worker -t <registry>/reporting-worker:<tag> .
#   docker build -f services/reporting/Dockerfile.migrate -t <registry>/reporting-migrate:<tag> .
#   docker build -f services/job-orchestration/Dockerfile.api -t <registry>/job-orchestration:<tag> .
#   docker build -f services/job-orchestration/Dockerfile.migrate -t <registry>/job-orchestration-migrate:<tag> .
#
# The registry database credential is a Docker secret, never a stack variable:
#   docker secret create registry_database_url -
# Audit credentials are Docker secrets created from Supabase Vault by the
# pipeline, never stack variables:
#   docker secret create audit_app_dsn -
#   docker secret create audit_retention_dsn -
#   docker secret create audit_service_tokens -
#     The JSON token map must carry a "reporting" entry whose token is
#     reporting_outbound_token: Reporting presents it on C10 POST /v1/events.
# Identity credentials and signing keys are Docker secrets created from Supabase
# Vault by the pipeline, never stack variables:
#   docker secret create identity_database_url -
#   docker secret create identity_service_tokens -
#     The JSON token map must carry a "notification" entry whose token is the
#     same value as notification_outbound_token: Notification presents it on C3
#     GET /v1/users/{userId}/contact, and any other caller is refused (403).
#     It must also carry a "reporting" entry whose token is
#     reporting_outbound_token: Reporting presents it on C3
#     GET /v1/internal/users/due, and any other caller is refused (403).
#   docker secret create identity_supabase_service_role -
#   docker secret create identity_gate_token_key -
#
# Account credentials are Docker secrets created from Supabase Vault by the
# pipeline, never stack variables. The migrator DSN carries DDL rights; the
# runtime DSN does not:
#   docker secret create account_database_url -
#   docker secret create account_migrate_database_url -
#   docker secret create account_service_tokens -
#   docker secret create account_supabase_service_role -
#
# Portfolio credentials are Docker secrets created from Supabase Vault by the
# pipeline. The migrator DSN carries DDL rights; the runtime DSN does not. The
# outbound token file holds the raw token Portfolio presents to C5–C10; the
# smoke token is held by the release job and is never mounted in the service:
#   docker secret create portfolio_database_url -
#   docker secret create portfolio_migrate_database_url -
#   docker secret create portfolio_outbound_token -
#   docker secret create portfolio_smoke_token -
#
# Reporting credentials are Docker secrets created from Supabase Vault by the
# pipeline. The migrator DSN carries DDL rights and the retention prune; the
# runtime DSN does not. The outbound token is the raw token Reporting presents to
# C3 and C7–C10; the smoke token is held by the release job only:
#   docker secret create reporting_database_url -
#   docker secret create reporting_migrate_database_url -
#   docker secret create reporting_outbound_token -
#   docker secret create reporting_smoke_token -
#
# Job Orchestration credentials are Docker secrets created from Supabase Vault by
# the pipeline. The migrate DSN mounts only in the migrate/prune job; the smoke
# token is held by the release job only:
#   docker secret create job_orchestration_database_url -
#   docker secret create job_orchestration_migrate_database_url -
#   docker secret create job_orchestration_outbound_token -
#   docker secret create job_orchestration_smoke_token -
#
# Market Data credentials are Docker secrets created from Supabase Vault by the
# pipeline. The C11 run token, the outbound service token, and provider keys are
# read from Vault at startup through the SECURITY DEFINER function; only the
# database DSN and the release smoke token are Docker secrets:
#   docker secret create market_data_database_url -
#   docker secret create market_data_smoke_token -
#
# Analytics credentials are Docker secrets created from Supabase Vault by the
# pipeline. The runtime DSN carries no DDL rights; the migrator DSN does:
#   docker secret create analytics_database_url -
#   docker secret create analytics_migrate_database_url -
#   docker secret create analytics_outbound_token -
#   docker secret create analytics_smoke_token -
#
# Ledger credentials are Docker secrets created from Supabase Vault by the
# pipeline. The runtime DSN carries no DDL rights; the migrator DSN does; the
# anonymiser DSN holds UPDATE on ledger_subjects only and is opened for the one
# C7 anonymise request:
#   docker secret create ledger_database_url -
#   docker secret create ledger_migrate_database_url -
#   docker secret create ledger_anonymiser_database_url -
#   docker secret create ledger_outbound_token -
#   docker secret create ledger_smoke_token -
#
# Non-secret configuration (JWT_JWKS_URL, JWT_ISSUER, JWT_AUDIENCE,
# REGISTRY/TAG) is supplied by the deployer's environment.
version: "3.9"

services:
  asset-registry:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/asset-registry:${TAG:-latest}
    environment:
      RUST_LOG: info
      ASSET_REGISTRY_PORT: "8081"
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      DATABASE_URL_FILE: /run/secrets/registry_database_url
    secrets:
      - registry_database_url
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  gateway:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/gateway:${TAG:-latest}
    environment:
      RUST_LOG: info
      GATEWAY_PORT: "8080"
      ASSET_REGISTRY_URL: http://asset-registry:8081
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      UPSTREAM_TIMEOUT_MS: "2000"
      GATEWAY_RATE_LIMIT_PER_MINUTE: "120"
      GATEWAY_ANONYMOUS_RATE_LIMIT_PER_MINUTE: "30"
    ports:
      - target: 8080
        published: 443
        mode: ingress
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/web:${TAG:-latest}
    ports:
      - target: 8080
        published: 80
        mode: ingress
    networks:
      - public
    # The static host has no writable state; nginx's pid, cache and temp
    # paths live on tmpfs. Port 8081 (stub_status, internal only) is not
    # published.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    stop_grace_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  audit-api:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/audit-api:${TAG:-latest}
    environment:
      RUST_LOG: info
      AUDIT_PORT: "8084"
      DATABASE_URL_FILE: /run/secrets/audit_app_dsn
      SERVICE_TOKENS_FILE: /run/secrets/audit_service_tokens
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AUDIT_APPENDS_PER_MINUTE: "${AUDIT_APPENDS_PER_MINUTE:-1000}"
      AUDIT_QUERIES_PER_MINUTE: "${AUDIT_QUERIES_PER_MINUTE:-30}"
      AUDIT_EXPORTS_PER_HOUR: "${AUDIT_EXPORTS_PER_HOUR:-5}"
    secrets:
      - audit_app_dsn
      - audit_service_tokens
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  audit-retention:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/audit-retention:${TAG:-latest}
    environment:
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/audit_retention_dsn
      AUDIT_SWEEP_INTERVAL_SECONDS: "${AUDIT_SWEEP_INTERVAL_SECONDS:-3600}"
      AUDIT_RETENTION_BATCH_SIZE: "${AUDIT_RETENTION_BATCH_SIZE:-10000}"
      AUDIT_RETENTION_MAX_BATCHES: "${AUDIT_RETENTION_MAX_BATCHES:-1000}"
      AUDIT_RETENTION_PAUSE_MS: "${AUDIT_RETENTION_PAUSE_MS:-200}"
      AUDIT_PARTITION_HORIZON_MONTHS: "${AUDIT_PARTITION_HORIZON_MONTHS:-3}"
      AUDIT_DELETION_BATCH: "${AUDIT_DELETION_BATCH:-20}"
    secrets:
      - audit_retention_dsn
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/audit-retention.heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/audit-retention.heartbeat) )) -lt 4200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  identity-api:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/identity-api:${TAG:-latest}
    environment:
      RUST_LOG: info
      IDENTITY_PORT: "8083"
      DATABASE_URL_FILE: /run/secrets/identity_database_url
      # Must map "notification" to the same token as notification_outbound_token.
      SERVICE_TOKENS_FILE: /run/secrets/identity_service_tokens
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/identity_supabase_service_role
      GATE_TOKEN_KEY_FILE: /run/secrets/identity_gate_token_key
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL}
      SUPABASE_STORAGE_URL: ${SUPABASE_STORAGE_URL}
      IDENTITY_EXPORT_BUCKET: "${IDENTITY_EXPORT_BUCKET:-identity-exports}"
      IDENTITY_WORKER_URL: http://identity-worker:8085
      IDENTITY_TOKEN_SERVICE: identity
      IDENTITY_API_POOL: "12"
      AUDIT_URL: http://audit-api:8084
      ACCOUNT_URL: ${ACCOUNT_URL:-http://account:8091}
      LEDGER_URL: ${LEDGER_URL:-http://ledger:8092}
      PORTFOLIO_URL: ${PORTFOLIO_URL:-http://portfolio:8101}
    secrets:
      - identity_database_url
      - identity_service_tokens
      - identity_supabase_service_role
      - identity_gate_token_key
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  identity-worker:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/identity-worker:${TAG:-latest}
    environment:
      RUST_LOG: info
      IDENTITY_WORKER_PORT: "8085"
      DATABASE_URL_FILE: /run/secrets/identity_database_url
      # Must map "notification" to the same token as notification_outbound_token.
      SERVICE_TOKENS_FILE: /run/secrets/identity_service_tokens
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/identity_supabase_service_role
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL}
      SUPABASE_STORAGE_URL: ${SUPABASE_STORAGE_URL}
      IDENTITY_EXPORT_BUCKET: "${IDENTITY_EXPORT_BUCKET:-identity-exports}"
      IDENTITY_TOKEN_SERVICE: identity
      IDENTITY_WORKER_POOL: "8"
      IDENTITY_SWEEP_INTERVAL_SECONDS: "${IDENTITY_SWEEP_INTERVAL_SECONDS:-60}"
      AUDIT_URL: http://audit-api:8084
      ACCOUNT_URL: ${ACCOUNT_URL:-http://account:8091}
      LEDGER_URL: ${LEDGER_URL:-http://ledger:8092}
      PORTFOLIO_URL: ${PORTFOLIO_URL:-http://portfolio:8101}
    secrets:
      - identity_database_url
      - identity_service_tokens
      - identity_supabase_service_role
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  account-api:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/account-api:${TAG:-latest}
    environment:
      RUST_LOG: info
      ACCOUNT_PORT: "8091"
      DATABASE_URL_FILE: /run/secrets/account_database_url
      SERVICE_TOKENS_FILE: /run/secrets/account_service_tokens
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/account_supabase_service_role
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL}
      ACCOUNT_WORKER_URL: http://account-worker:8092
      ACCOUNT_TOKEN_SERVICE: account
      ACCOUNT_API_POOL: "12"
      AUDIT_URL: http://audit-api:8084
      NOTIFICATION_URL: ${NOTIFICATION_URL:-http://notification-api:8099}
      ASSET_REGISTRY_URL: http://asset-registry:8081
      EVM_RPC_URL: ${EVM_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
    secrets:
      - account_database_url
      - account_service_tokens
      - account_supabase_service_role
    networks:
      - internal
      - public
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  account-worker:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/account-worker:${TAG:-latest}
    environment:
      RUST_LOG: info
      ACCOUNT_WORKER_PORT: "8092"
      DATABASE_URL_FILE: /run/secrets/account_database_url
      SERVICE_TOKENS_FILE: /run/secrets/account_service_tokens
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/account_supabase_service_role
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL}
      ACCOUNT_TOKEN_SERVICE: account
      ACCOUNT_WORKER_POOL: "8"
      ACCOUNT_SYNC_INTERVAL_SECONDS: "${ACCOUNT_SYNC_INTERVAL_SECONDS:-60}"
      ACCOUNT_VERIFY_INTERVAL_SECONDS: "${ACCOUNT_VERIFY_INTERVAL_SECONDS:-21600}"
      AUDIT_URL: http://audit-api:8084
      NOTIFICATION_URL: ${NOTIFICATION_URL:-http://notification-api:8099}
      ASSET_REGISTRY_URL: http://asset-registry:8081
      EVM_RPC_URL: ${EVM_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
    secrets:
      - account_database_url
      - account_service_tokens
      - account_supabase_service_role
    networks:
      - internal
      - public
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8092/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  account-migrate:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/account-migrate:${TAG:-latest}
    environment:
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/account_migrate_database_url
    secrets:
      - account_migrate_database_url
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  portfolio:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/portfolio-api:${TAG:-latest}
    environment:
      RUST_LOG: info
      PORTFOLIO_PORT: "8101"
      DATABASE_URL_FILE: /run/secrets/portfolio_database_url
      OUTBOUND_TOKEN_FILE: /run/secrets/portfolio_outbound_token
      JWT_JWKS_URL: ${JWT_JWKS_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      ACCOUNT_URL: http://account-api:8091
      MARKET_DATA_URL: http://market-data-api:8093
      LEDGER_URL: http://ledger-api:8097
      IDENTITY_URL: http://identity-api:8089
      NOTIFICATION_URL: ${NOTIFICATION_URL:-http://notification-api:8099}
      AUDIT_URL: http://audit-api:8084
      PORTFOLIO_WORKER_URL: http://portfolio-worker:8102
      PORTFOLIO_TOKEN_SERVICE: portfolio
      PORTFOLIO_API_POOL: "12"
    secrets:
      - portfolio_database_url
      - portfolio_outbound_token
    networks:
      - internal
      - public
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8101/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.25"
