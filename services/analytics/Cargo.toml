[package]
name = "analytics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Analytics service: binary wiring for analytics-api and analytics-worker"

[lib]
name = "analytics"
path = "src/lib.rs"

[[bin]]
name = "analytics-api"
path = "src/bin/api.rs"

[[bin]]
name = "analytics-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "analytics-migrate"
path = "src/bin/migrate.rs"

[dependencies]
analytics-domain = { path = "domain" }
analytics-application = { path = "application" }
analytics-infrastructure = { path = "infrastructure" }
analytics-http = { path = "http" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
