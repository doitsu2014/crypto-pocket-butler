[package]
name = "ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Ledger service: binary wiring for ledger-api, ledger-worker and ledger-migrate"

[lib]
name = "ledger"
path = "src/lib.rs"

[[bin]]
name = "ledger-api"
path = "src/bin/api.rs"

[[bin]]
name = "ledger-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "ledger-migrate"
path = "src/bin/migrate.rs"

[dependencies]
ledger-domain = { path = "domain" }
ledger-application = { path = "application" }
ledger-infrastructure = { path = "infrastructure" }
ledger-http = { path = "http" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
