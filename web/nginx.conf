server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Access logs must not record request headers. The support console's
    # free-text read reason travels in X-Support-Reason and must never reach
    # a log, browser history, or referrer: do not add $http_x_support_reason
    # (or any other $http_* header) to a log_format. The default format logs
    # the URL, which no longer carries the reason.
    #
    # The support CSP's connect-src 'self' requires the API gateway to be
    # same-origin through this CDN host. If deploy configures VITE_GATEWAY_URL
    # on another origin, add that origin to connect-src or the C2 calls are
    # blocked.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The support console is a separate SPA. It never registers its own
    # service worker. The customer PWA's root-scoped worker would otherwise
    # control /support and the same-origin /v1 calls, so U2 must make that
    # worker bypass /support and /v1; the console also unregisters any
    # registration whose scope covers /support at startup (src/pwa/isolate.ts).
    # HTML is no-store and hashed assets are immutable.
    location = /support {
        return 301 /support/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location /support/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location /support/ {
        try_files $uri $uri/ /support/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:;" always;
}
