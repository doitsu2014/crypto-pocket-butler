# Local override of web/nginx.conf.
#
# Differences from the production file:
#   - /v1/ is proxied to the gateway container (in production the CDN routes it).
#   - the CSP allows the local Supabase API on 127.0.0.1:54321 and
#     localhost:54321, which production's *.supabase.co rule does not cover.
#   - Strict-Transport-Security is omitted: this stack is plain HTTP on a
#     developer laptop.
#
# The production header set is otherwise unchanged; each cache location repeats
# the security headers because an add_header in a location replaces the
# inherited set.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Reporting-Endpoints 'csp="/v1/telemetry/csp-reports"' always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; report-to csp" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. VITE_GATEWAY_URL is /v1, exactly as in production.
    location /v1/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 2m;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints 'csp="/v1/telemetry/csp-reports"' always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; report-to csp" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Reporting-Endpoints 'csp="/v1/telemetry/csp-reports"' always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co wss://relay.walletconnect.com wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; report-to csp" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none';" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none';" always;
    }

    location = /support {
        return 301 /support/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location /support/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location /support/ {
        try_files $uri $uri/ /support/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; object-src 'none';" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
