[package]
name = "reporting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Reporting service: binary wiring for reporting-api and reporting-worker"

[lib]
name = "reporting"
path = "src/lib.rs"

[[bin]]
name = "reporting-api"
path = "src/bin/api.rs"

[[bin]]
name = "reporting-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "reporting-migrate"
path = "src/bin/migrate.rs"

[dependencies]
reporting-domain = { path = "domain" }
reporting-application = { path = "application" }
reporting-infrastructure = { path = "infrastructure" }
reporting-http = { path = "http" }

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
http-body-util.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
rsa.workspace = true
rust_decimal.workspace = true
