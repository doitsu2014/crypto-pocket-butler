      RUST_LOG: info
      ANALYTICS_WORKER_PORT: "8096"
      DATABASE_URL_FILE: /run/secrets/analytics_database_url
      OUTBOUND_TOKEN_FILE: /run/secrets/analytics_outbound_token
      SMOKE_TOKEN_FILE: /run/secrets/analytics_smoke_token
      IDENTITY_URL: http://identity-api:8083
      AUDIT_URL: http://audit-api:8084
      ANALYTICS_WORKER_POOL: "6"
    secrets:
      - analytics_database_url
      - analytics_outbound_token
      - analytics_smoke_token
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  analytics-migrate:
    image: ${REGISTRY:-ghcr.io/crypto-pocket-butler}/analytics-migrate:${TAG:-latest}
    environment:
      RUST_LOG: info
      DATABASE_URL_FILE: /run/secrets/analytics_migrate_database_url
    secrets:
      - analytics_migrate_database_url
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  public:
    driver: overlay
  internal:
    driver: overlay
    internal: true
    # NFR9.1: the internal overlay between services is encrypted.
    encrypted: true

secrets:
  registry_database_url:
    external: true
  audit_app_dsn:
    external: true
  audit_retention_dsn:
    external: true
  audit_service_tokens:
    external: true
  identity_database_url:
    external: true
  identity_service_tokens:
    external: true
  identity_supabase_service_role:
    external: true
  identity_gate_token_key:
    external: true
  account_database_url:
    external: true
  account_migrate_database_url:
    external: true
  account_service_tokens:
    external: true
  account_supabase_service_role:
    external: true
  market_data_database_url:
    external: true
  market_data_smoke_token:
    external: true
  analytics_database_url:
    external: true
  analytics_migrate_database_url:
    external: true
  analytics_outbound_token:
    external: true
  analytics_smoke_token:
    external: true
