[package]
name = "job-orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Job Orchestration service: wiring for job-orchestration-api"

[lib]
name = "job_orchestration"
path = "src/lib.rs"

[[bin]]
name = "job-orchestration-api"
path = "src/bin/api.rs"

[[bin]]
name = "job-orchestration-migrate"
path = "src/bin/migrate.rs"

[dependencies]
job-orchestration-domain = { path = "domain" }
job-orchestration-application = { path = "application" }
job-orchestration-infrastructure = { path = "infrastructure" }
job-orchestration-http = { path = "http" }

anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
