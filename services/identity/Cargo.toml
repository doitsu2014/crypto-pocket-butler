[package]
name = "identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Identity service: binary wiring for identity-api and identity-worker"

[lib]
name = "identity"
path = "src/lib.rs"

[[bin]]
name = "identity-api"
path = "src/bin/api.rs"

[[bin]]
name = "identity-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "identity-migrate"
path = "src/bin/migrate.rs"

[dependencies]
identity-domain = { path = "domain" }
identity-application = { path = "application" }
identity-infrastructure = { path = "infrastructure" }
identity-http = { path = "http" }

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
http-body-util.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
rsa.workspace = true
sqlx.workspace = true
tower.workspace = true
uuid.workspace = true
